<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>ADL 360 Leadership Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17202A; --ink-2:#3E4752; --muted:#5B6470; --line:#E3E6EA; --line-2:#D5DADF;
  --bg:#F6F7F8; --card:#FFFFFF; --accent:#0E5A5E; --accent-ink:#0A4245; --accent-soft:#E6F1F1; --accent-soft-2:#D6EAEA;
  --dark:#0B2E30; --dark-muted:#A9C3C4; --mint:#5FC4C0; --danger:#B42318;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
.shell{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--card);display:flex;flex-direction:column}
@media (min-width:640px){
  body{padding:32px 16px}
  .shell{min-height:auto;border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);overflow:hidden}
  .screen{min-height:720px}
}
.screen{flex:1;display:flex;flex-direction:column;padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.meta{font-size:13px;font-weight:600;color:var(--muted)}
.iconbtn{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:22px;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--bg)}
.progress{margin-top:8px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress>div{height:6px;background:var(--accent);border-radius:3px;transition:width .25s}
h1[tabindex],h2[tabindex]{outline:none}
h1{margin:0;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:23px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.lead{color:var(--ink-2);font-size:16px;line-height:1.55}
.small{font-size:14px;color:var(--muted)}
.spacer{flex:1;min-height:24px}
.stack{display:flex;flex-direction:column}
.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt28{margin-top:28px}
.avatar{width:60px;height:60px;border-radius:30px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.steps{border:1px solid var(--line);border-radius:var(--radius)}
.step{display:flex;gap:14px;align-items:center;padding:14px 16px}
.step+.step{border-top:1px solid var(--line)}
.num{width:28px;height:28px;flex:none;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.note svg{flex:none;margin-top:2px}
details.more{font-size:14px;color:var(--ink-2)}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
details.more p{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;padding:0 18px}
.btn:hover{background:var(--accent-ink);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.secondary:hover{background:var(--bg)}
.linkbtn{background:none;border:none;color:var(--muted);font-weight:600;font-size:15px;text-decoration:underline;cursor:pointer;padding:12px;align-self:center}
.linkbtn:hover{color:var(--ink)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-size:16px;font-weight:600;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt .k{width:30px;height:30px;flex:none;border-radius:15px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink-2)}
.opt .lbl{flex:1}
.opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.sel .k{background:rgba(255,255,255,.18);color:#fff}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1}
.kbd-hint{font-size:13px;color:var(--muted);text-align:center}
@media (hover:none){.kbd-hint{display:none}}
.choice{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;text-align:left;width:100%}
.choice:hover{border-color:var(--accent)}
.choice.primary{border:2px solid var(--accent);background:#F2F8F8}
.choice .ic{width:52px;height:52px;flex:none;border-radius:26px;background:#EEF0F2;display:flex;align-items:center;justify-content:center}
.choice.primary .ic{background:var(--accent)}
.choice .t{font-size:18px;font-weight:800}
.choice .d{margin-top:3px;font-size:14px;line-height:1.4;color:var(--ink-2)}
.pill{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft-2);padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:14px;color:var(--muted)}
textarea.field{width:100%;min-height:200px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line-2);font-size:16px;line-height:1.5;resize:vertical;background:#fff}
textarea.field:focus,.opt:focus-visible,.btn:focus-visible,.choice:focus-visible,.iconbtn:focus-visible,.linkbtn:focus-visible,.roundbtn:focus-visible,.chatin:focus{outline:3px solid #7FB7B9;outline-offset:2px}
.err{color:var(--danger);font-size:14px;font-weight:600}
.spinner{width:28px;height:28px;border-radius:14px;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{align-items:center;justify-content:center;text-align:center}

/* Voice */
.voice{background:var(--dark);color:#fff}
.voice .meta,.voice .small{color:var(--dark-muted)}
.topics{display:flex;gap:8px;margin-top:18px}
.topic{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--dark-muted)}
.topic i{display:block;height:4px;border-radius:2px;background:#2A5154}
.orbwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:260px}
.orb{width:200px;height:200px;border-radius:100px;background:rgba(95,196,192,.10);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.orb>div{width:150px;height:150px;border-radius:75px;background:rgba(95,196,192,.18);display:flex;align-items:center;justify-content:center}
.orb>div>div{width:100px;height:100px;border-radius:50px;background:var(--mint);display:flex;align-items:center;justify-content:center;gap:5px}
.orb .bar{width:5px;height:16px;border-radius:3px;background:var(--dark);transition:height .12s}
.orb.speaking{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.vstatus{font-size:15px;font-weight:600;color:var(--mint);min-height:22px}
.caption{background:rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;min-height:90px}
.caption .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dark-muted)}
.caption .txt{margin-top:6px;font-size:17px;line-height:1.45;max-height:160px;overflow:auto}
.controls{display:flex;justify-content:space-between;margin-top:20px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;font-size:13px;color:var(--dark-muted)}
.roundbtn{width:60px;height:60px;border-radius:30px;border:none;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.roundbtn:hover{background:rgba(255,255,255,.2)}
.roundbtn.end{background:#C2410C}
.roundbtn.end:hover{background:#9A3412}
.roundbtn.on{background:#fff;color:var(--dark)}
.voice .linkbtn{color:var(--dark-muted)}
.banner{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}

/* Chat */
.chat{padding:0;background:var(--bg)}
.chathead{background:#fff;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.chathead .topic{color:var(--muted)}
.chathead .topic i{background:var(--line-2)}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:86%;padding:11px 15px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.agent{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-radius:18px 4px 18px 18px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px}
.typing span{width:7px;height:7px;border-radius:4px;background:#9AA3AD;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.chatin{flex:1;min-width:0;min-height:48px;max-height:160px;padding:12px 16px;border-radius:24px;border:1.5px solid var(--line-2);font-size:16px;line-height:1.4;resize:none;background:#fff}
.cbtn{width:48px;height:48px;flex:none;border-radius:24px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#EEF0F2;color:var(--ink)}
.cbtn.send{background:var(--accent);color:#fff}
.cbtn.rec{background:#C2410C;color:#fff}
.cbtn:disabled{opacity:.5;cursor:default}
.composer .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;gap:6px;align-items:center;height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line-2);font-size:14px;font-weight:700;color:var(--accent);background:#fff;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.demo-flag{background:#FFF4D6;color:#6B4E00;font-size:13px;font-weight:600;text-align:center;padding:6px 10px}
</style>
</head>
<body>
<div class="shell">
  <div id="demoFlag" class="demo-flag" hidden>Demo mode: nothing is saved and the interviewer is simulated.</div>
  <main id="app" class="screen center" aria-live="polite"><div class="spinner" role="status" aria-label="Loading"></div></main>
</div>

<script type="module">
// ============================================================
//  CONFIG: paste your Apps Script web app URL (ends in /exec)
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbx7OWWseT7SXR-jfkYyy5sqdG-gLrGFqxPMtBjTNsMNNdMerK2H0TZ-ucgh5JXJ7Rzb3g/exec';
const SDK_URL = './elevenlabs-client.js'; // ElevenLabs client SDK v1.26.0, bundled locally (no CDN dependency)

// ------------------------------------------------------------
const params = new URLSearchParams(location.search);
const CODE = (params.get('s') || '').trim().toLowerCase();
const DEMO = params.get('demo') === '1' || !/^https:\/\/script\.google\.com\//.test(API_URL);
if (DEMO) document.getElementById('demoFlag').hidden = false;

const app = document.getElementById('app');
const STORE_KEY = 'adl360:' + (CODE || 'demo');

let S = null;       // survey content from the server (name, questions...)
let st = null;      // this reviewer's progress (persisted locally)
let convo = null;   // live ElevenLabs conversation
let endingByUser = false;

// ---------- icons ----------
const I = {
  back: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  lock: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E5A5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  mic: (c='currentColor',s=24) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>`,
  micOff: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3"/><path d="M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 10.6 6"/><path d="M12 18v3"/></svg>',
  kb: (c='currentColor') => `<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>`,
  pen: '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  check: (c='currentColor',s=20) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>`,
  send: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
};

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first = n => String(n || '').trim().split(/\s+/)[0] || 'your colleague';
const initials = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  return [...b].map(x => x.toString(16).padStart(2, '0')).join('').replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5');
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; } }
function render(html, cls = '') {
  app.className = 'screen ' + cls;
  app.innerHTML = html;
  const h = app.querySelector('h1,h2');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  window.scrollTo(0, 0);
}
const on = (sel, ev, fn) => { const el = app.querySelector(sel); if (el) el.addEventListener(ev, fn); return el; };

// ---------- backend ----------
async function apiGet(params, tries = 3) {
  if (DEMO) return demoApi('GET', params);
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  let last;
  for (let i = 0; i < tries; i++) {
    try { const r = await fetch(url, { method: 'GET' }); return await r.json(); }
    catch (e) { last = e; await sleep(600 * (i + 1)); }
  }
  throw last;
}
async function apiPost(body, tries = 3) {
  if (DEMO) return demoApi('POST', body);
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }); // text/plain: no CORS preflight
      return await r.json();
    } catch (e) { last = e; await sleep(600 * (i + 1)); }
  }
  throw last;
}

// ---------- demo backend ----------
const DEMO_Q = ['Genuinely listens to you and your concerns?','Persists despite significant challenges or obstacles?','Knows what is important to you?','Considers the merits of your ideas even when they differ from their own?','Keeps calm in stressful situations?','Appreciates your efforts?','Tries new experiences to discover fresh perspectives?','Challenges accepted assumptions?','Treats the root cause rather than the symptom?','Discovers insights that have changed the direction of their team or organization?','Articulates where the organization should (and should not) focus?','Delivers results, which significantly exceed expectations?','Helps you develop your capabilities?','Is open to your influence?','Inquires about your needs and challenges?','Builds partnerships to increase support for their initiatives?','Raises difficult issues?',"Says what they think even when it's controversial?",'Discloses their feelings and concerns to you?','Recognizes your accomplishments?','Provides you honest feedback?','Resolves conflict productively?','Admits their mistakes openly?','Asks you how they can improve?','Modifies their behavior in response to your feedback?','Identifies opportunities others may have missed?','Admits when they do not know an answer?','Sets goals that go beyond incremental improvements?','Behaves in a way which builds your trust?','Solves problems that have impact beyond their area of responsibility?','Delivers what they promise?','Shows enthusiasm for what needs to be accomplished?','Articulates a vision which is compelling to you?','Displays optimism about the future?','Speaks about their core values and beliefs?','Displays confidence in their abilities?','Motivates you to support their initiatives?','Delegates responsibility when appropriate?','Goes beyond self-interest to benefit others?','Strives to improve their capabilities?','Advocates for your needs?'];
async function demoApi(method, p) {
  await sleep(350);
  if (method === 'GET' && p.action === 'student') return {
    ok: true, name: 'Priya Shah', deadline: '[DUE DATE]', questions: DEMO_Q,
    scale: ['Very Little (1)', '(2)', '(3)', '(4)', 'To a Great Extent (5)'],
    q42: 'I have worked with my colleague for:', q42Options: ['Less than 1 year', 'Between 1 and 2 years', 'Between 3 and 4 years', 'More than 4 years'],
    q43: 'The following best describes my relationship to my colleague:', q43Options: ['I am their supervisor', 'I am their peer', 'I am their subordinate'],
    q44: 'Please provide suggestions on how your colleague could further develop their leadership capability.'
  };
  if (method === 'GET' && p.action === 'token') return { ok: true, demo: true };
  return { ok: true };
}
class DemoConversation {
  constructor(opts) { this.o = opts; this.n = 0; this.muted = false; }
  static async startSession(opts) {
    const c = new DemoConversation(opts);
    await sleep(500);
    opts.onStatusChange?.({ status: 'connected' });
    opts.onConnect?.({ conversationId: 'demo_' + Date.now() });
    c.say(`Hello! I'm an AI agent built at the Stanford Graduate School of Business and I'd like to thank you for taking the time to discuss ${opts.dynamicVariables.student_name}. ... To get us started, could you please briefly describe your working relationship with ${opts.dynamicVariables.student_name}?`);
    if (!opts.textOnly) c.loop = setInterval(() => c.say(DemoConversation.lines[(c.n++) % DemoConversation.lines.length]), 7000);
    return c;
  }
  static lines = ['Thank you, that\'s helpful context. And just so I know who I\'m speaking with, what is your name?', 'To respect your schedule, how many minutes do you have for this conversation?', 'First, what is a contribution they made to your team that you thought was significant?', 'When you say "we", what part of that did they personally own?'];
  async say(t) {
    this.o.onModeChange?.({ mode: 'speaking' });
    await sleep(this.o.textOnly ? 900 : 300);
    this.o.onMessage?.({ role: 'agent', source: 'ai', message: t });
    await sleep(this.o.textOnly ? 0 : 2500);
    this.o.onModeChange?.({ mode: 'listening' });
  }
  sendUserMessage(t) { this.say(DemoConversation.lines[(this.n++) % DemoConversation.lines.length]); }
  sendContextualUpdate() {}
  setMicMuted(m) { this.muted = m; }
  getInputVolume() { return this.muted ? 0 : Math.random() * 0.4; }
  getOutputVolume() { return Math.random() * 0.6; }
  async endSession() { clearInterval(this.loop); this.o.onDisconnect?.({ reason: 'user' }); }
}

// ---------- boot ----------
boot();
async function boot() {
  if (!CODE && !DEMO) return renderBadLink();
  try {
    const res = await apiGet({ action: 'student', s: CODE });
    if (!res.ok) return renderBadLink();
    S = res;
  } catch (e) {
    return render(`<div class="stack center" style="flex:1"><h2>We couldn't load the survey</h2><p class="lead mt12">Please check your internet connection and try again.</p><button class="btn mt24" id="retry" style="max-width:240px">Try again</button></div>`, 'center');
  }
  st = load();
  if (!st || !st.rid) st = { rid: uuid(), i: 0, answers: Array(41).fill(null), q42: null, q43: null, stage: 'welcome', ratingsSaved: false };
  route();
}

const TOTAL = 43;
function renderRating() {
  const i = st.i;
  if (i >= TOTAL) return finishRatings();
  const pct = Math.round((i / TOTAL) * 100);
  let body, opts, current;
  if (i < 41) {
    current = st.answers[i];
    const labels = ['Very Little', '', '', '', 'To a Great Extent'];
    opts = [1, 2, 3, 4, 5].map((v, k) => `<button class="opt${current === v ? ' sel' : ''}" data-v="${v}" aria-pressed="${current === v}"><span class="k">${v}</span><span class="lbl">${labels[k] || '&nbsp;'}</span>${current === v ? I.check('#fff') : ''}</button>`).join('');
    body = `<p class="small mt24">How much does ${esc(first(S.name))} demonstrate this behavior?</p>
      <h2 class="mt8">${esc(S.questions[i])}</h2>`;
  } else {
    const isQ42 = i === 41;
    const list = isQ42 ? S.q42Options : S.q43Options;
    current = isQ42 ? st.q42 : st.q43;
    opts = list.map((t, k) => `<button class="opt${current === k ? ' sel' : ''}" data-v="${k}" aria-pressed="${current === k}"><span class="lbl">${esc(t)}</span>${current === k ? I.check('#fff') : ''}</button>`).join('');
    body = `<p class="small mt24">About you</p><h2 class="mt8">${esc(isQ42 ? S.q42 : S.q43)}</h2>`;
  }
  render(`
    <div class="topbar">
      <button class="iconbtn" id="back" aria-label="Back">${I.back}</button>
      <span class="meta">Part 1 of 2 · Ratings</span><span style="width:32px"></span>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${i}" aria-label="Progress"><div style="width:${pct}%"></div></div>
    <p class="small mt8">Question ${i + 1} of ${TOTAL}</p>
    ${body}
    <div class="stack gap10 mt20" role="group" aria-label="Answer options">${opts}</div>
    <button class="linkbtn mt8" id="skip">${i < 41 ? "I don't have enough information: skip" : 'Prefer not to say: skip'}</button>
    <div class="spacer"></div>
    ${i < 41 ? '<p class="kbd-hint">Tip: press 1–5 on your keyboard</p>' : ''}
  `);
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pick(Number(b.dataset.v))));
  on('#skip', 'click', () => { setAnswer(null); next(); });
  on('#back', 'click', () => { if (st.i === 0) go('welcome'); else { st.i--; save(); renderRating(); } });
}
function setAnswer(v) {
  if (st.i < 41) st.answers[st.i] = v; else if (st.i === 41) st.q42 = v; else st.q43 = v;
  save();
}
let advancing = false;
async function pick(v) {
  if (advancing) return;
  advancing = true;
  setAnswer(v);
  app.querySelectorAll('.opt').forEach(b => { const s = Number(b.dataset.v) === v; b.classList.toggle('sel', s); b.setAttribute('aria-pressed', s); });
  await sleep(220);
  advancing = false;
  next();
}
function next() { st.i++; save(); renderRating(); }
document.addEventListener('keydown', e => {
  if (!st || st.stage !== 'rate' || st.i >= 41 || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  if (/^[1-5]$/.test(e.key)) pick(Number(e.key));
});

// ---------- interview (voice or typed) ----------
let mode = null, log = [], topicIdx = 0, sessions = 0, volTimer = null, muted = false;
const TOPIC_HINTS = [/impact|contribution|significant/i, /strength/i, /effective|develop|coach|improv/i];

async function loadSDK() {
  if (DEMO) return { Conversation: DemoConversation };
  return await import(SDK_URL);
}

async function startInterview(m, isSwitch = false) {
  mode = m; endingByUser = false;
  if (!isSwitch) { log = []; topicIdx = 0; t0 = 0; }
  if (m === 'voice') renderVoiceShell('Connecting…'); else renderChatShell(true);
  try {
    if (m === 'voice' && !DEMO) {
      try {
        const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
        ms.getTracks().forEach(t => t.stop());
      } catch (e) {
        return renderStories("We couldn't use your microphone. Allow microphone access in your browser settings, or choose Type instead.");
      }
    }
    const tok = await apiGet({ action: 'token', s: CODE, rid: st.rid, mode: m });
    if (!tok.ok) {
      const why = tok.error === 'too_many_starts' ? 'You have started the interview several times. Please choose Write instead.' : 'The interviewer is not available right now. Please try again, or choose Write instead.';
      return renderStories(why);
    }
    const { Conversation } = await loadSDK();
    const opts = {
      dynamicVariables: { student_name: S.name },
      onConnect: ({ conversationId }) => {
        sessions++;
        apiPost({ action: 'attachConversation', s: CODE, rid: st.rid, conversationId, mode: m }).catch(() => {});
        if (isSwitch) {
          setTimeout(() => {
            try { convo?.sendContextualUpdate('The interviewee was already part-way through this interview and has just ' + (m === 'type' ? 'switched from voice to typing' : 'switched from typing to voice') + ' (or reconnected). Treat them as a returning caller (PATH A): do not repeat the opening questions; ask what topic they were on and continue from there.'); } catch (e) {}
          }, 400);
        }
      },
      onMessage: ({ message, role, source }) => {
        const who = role || (source === 'ai' ? 'agent' : 'user');
        if (!message) return;
        if (who === 'agent') {
          TOPIC_HINTS.forEach((rx, k) => { if (k >= topicIdx && rx.test(message) && k <= topicIdx + 1) topicIdx = k; });
          log.push({ who: 'agent', text: message });
          mode === 'voice' ? updateVoice({ agent: message }) : addMsg('agent', message);
        } else if (mode === 'voice') {
          log.push({ who: 'user', text: message });
          updateVoice({ user: message });
        }
      },
      onModeChange: ({ mode: md }) => { if (mode === 'voice') updateVoice({ mode: md }); else setTyping(md === 'speaking'); },
      onStatusChange: ({ status }) => { if (mode === 'voice' && status === 'connecting') updateVoice({ status: 'Connecting…' }); },
      onDisconnect: (details) => {
        clearInterval(volTimer);
        if (endingByUser) return;
        if (details && details.reason === 'agent') return finishInterview(); // interviewer ended the call normally
        connectionLost();
      },
      onError: (msg) => { console.warn('Interview error', msg); }
    };
    if (DEMO) { opts.textOnly = m === 'type'; }
    else { opts.signedUrl = tok.signedUrl; opts.textOnly = m === 'type'; opts.connectionType = 'websocket'; }
    convo = await Conversation.startSession(opts);
    if (m === 'voice') { muted = false; updateVoice({ status: 'Listening…' }); startVolume(); }
    else enableComposer(true);
  } catch (e) {
    console.error(e);
    renderStories('Something went wrong starting the interview. Please try again, or choose Write instead.');
  }
}

function topicBars(dark) {
  const names = ['Impact', 'Strengths', 'Growth'];
  return `<div class="topics" aria-label="Interview topics">${names.map((n, k) => {
    const done = k < topicIdx, cur = k === topicIdx;
    const fill = done ? (dark ? 'var(--mint)' : 'var(--accent)') : cur ? `linear-gradient(90deg, ${dark ? 'var(--mint)' : 'var(--accent)'} 45%, ${dark ? '#2A5154' : 'var(--line-2)'} 45%)` : '';
    return `<div class="topic"${cur ? ` style="color:${dark ? '#fff' : 'var(--ink)'};font-weight:700"` : ''}><i style="${fill ? 'background:' + fill : ''}"></i>${n}</div>`;
  }).join('')}</div>`;
}

// Voice UI
function renderVoiceShell(status) {
  render(`

  on('#totype', 'click', () => switchMode('type'));
  let armed = false;
  on('#end', 'click', () => {
    if (!armed) { armed = true; app.querySelector('#endlbl').textContent = 'Tap again to finish'; setTimeout(() => { armed = false; const l = app.querySelector('#endlbl'); if (l) l.textContent = "I'm done"; }, 4000); return; }
    finishInterview();

let clockT = null, t0 = 0;
function startClock() {
  if (!t0) t0 = Date.now();
  clearInterval(clockT);
  clockT = setInterval(() => {
    const el = document.getElementById('clock'); if (!el) return clearInterval(clockT);
    const s = Math.floor((Date.now() - t0) / 1000);
    el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
}
function updateVoice({ agent, user, mode: md, status }) {
  const cap = document.getElementById('cap'), vs = document.getElementById('vstatus'), orb = document.getElementById('orb');
  if (agent && cap) cap.textContent = agent;
  if (md && vs) { vs.textContent = md === 'speaking' ? 'Interviewer speaking…' : (muted ? 'Microphone muted' : 'Listening…'); orb?.classList.toggle('speaking', md === 'speaking'); }
  if (status && vs) vs.textContent = status;
  const tp = document.getElementById('topics'); if (tp) tp.innerHTML = topicBars(true);
}
function startVolume() {
  clearInterval(volTimer);
  volTimer = setInterval(() => {
    const bars = app.querySelectorAll('.orb .bar'); if (!bars.length || !convo) return;
    let v = 0;
    try { v = Math.max(convo.getOutputVolume?.() || 0, muted ? 0 : (convo.getInputVolume?.() || 0)); } catch (e) {}
    bars.forEach((b, k) => { const h = 12 + Math.min(1, v * 2.2) * [18, 34, 26, 40, 22][k]; b.style.height = h + 'px'; });
  }, 110);
}

// Chat UI
function renderChatShell(connecting) {
  render(`
    <div class="chathead">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div><div class="small">Interview about</div><div style="font-size:18px;font-weight:700">${esc(S.name)}</div></div>

  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; app.querySelector('#send').disabled = !ta.value.trim() || ta.disabled; };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(hover:none)').matches) { e.preventDefault(); sendChat(); } });

    finishInterview();

function enableComposer(onoff) {
  const ta = app.querySelector('#chatin'); if (!ta) return;
  ta.disabled = !onoff; ta.placeholder = onoff ? 'Type your answer…' : 'Connecting…';
  if (onoff && !matchMedia('(hover:none)').matches) ta.focus();
}
function addMsg(who, text) {
  const msgs = app.querySelector('#msgs'); if (!msgs) return;
  msgs.querySelector('.typing')?.remove();
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text; msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  const tp = document.getElementById('topics'); if (tp) tp.innerHTML = topicBars(false);
}
function setTyping(onoff) {
  const msgs = app.querySelector('#msgs'); if (!msgs) return;
  const ex = msgs.querySelector('.typing');
  if (onoff && !ex) { const t = document.createElement('div'); t.className = 'typing'; t.setAttribute('aria-label', 'Interviewer is typing'); t.innerHTML = '<span></span><span></span><span></span>'; msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight; }
  if (!onoff && ex) ex.remove();
}
function sendChat() {
  const ta = app.querySelector('#chatin'); if (!ta || ta.disabled) return;
  const text = ta.value.trim(); if (!text || !convo) return;
  stopDictation();
  try { convo.sendUserMessage(text); } catch (e) { return connectionLost(); }
  log.push({ who: 'user', text }); addMsg('user', text); setTyping(true);
  ta.value = ''; ta.style.height = 'auto'; app.querySelector('#send').disabled = true;
}
// Dictation button (browsers with speech recognition; phone keyboards also have their own mic)
let rec = null, recOn = false;
function setupDictation(ta, grow) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = app.querySelector('#dict');
  if (!SR || !btn) return;
  btn.hidden = false;
  btn.addEventListener('click', () => {
    if (recOn) return stopDictation();
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
    const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
    rec.onresult = ev => { let t = ''; for (let k = 0; k < ev.results.length; k++) t += ev.results[k][0].transcript; ta.value = base + t; grow(); };
    rec.onend = () => { recOn = false; btn.classList.remove('rec'); btn.setAttribute('aria-label', 'Dictate'); };
    rec.onerror = () => stopDictation();
    try { rec.start(); recOn = true; btn.classList.add('rec'); btn.setAttribute('aria-label', 'Stop dictation'); } catch (e) {}
  });
}
function stopDictation() { try { rec?.stop(); } catch (e) {} recOn = false; app.querySelector('#dict')?.classList.remove('rec'); }

async function switchMode(m) {
  endingByUser = true;
  clearInterval(volTimer);
  try { await convo?.endSession(); } catch (e) {}
  convo = null;
  startInterview(m, true);
}
function connectionLost() {
  convo = null;
  const box = document.getElementById('lost'); if (!box) return;
  box.innerHTML = `<div class="banner" role="alert" style="${mode === 'type' ? 'background:#FFF4ED;color:#7A2E0E' : ''}">The connection dropped. Your answers so far are saved.
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="reconnect" style="min-height:44px;width:auto;font-size:15px">Reconnect</button><button class="btn secondary" id="finish2" style="min-height:44px;width:auto;font-size:15px">Finish</button></div></div>`;
  on('#reconnect', 'click', () => startInterview(mode, true));
  on('#finish2', 'click', finishInterview);
  enableComposer(false);
}
async function finishInterview() {
  endingByUser = true;
  clearInterval(volTimer); clearInterval(clockT); stopDictation();
  try { await convo?.endSession(); } catch (e) {}
  convo = null;
  try { await apiPost({ action: 'storyDone', s: CODE, rid: st.rid }); } catch (e) {}
  st.interviewDone = true; go('done');
}

// ---------- done ----------
function renderDone() {
  const f = first(S.name);
  const storyLine = st.interviewDone ? 'Interview' : st.writtenSent ? 'Written answer' : 'Skipped';
  render(`
    <div class="topbar"><span class="brand">ADL 360</span></div>
    <div class="stack" style="flex:1;justify-content:center">
      <div style="width:72px;height:72px;border-radius:36px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center">${I.check('#0E5A5E', 34)}</div>
      <h1 class="mt24">Thank you</h1>
      <p class="lead mt12">Your feedback for ${esc(f)} is in. They will only see it combined with their other reviewers' input, never with your name on it.</p>
      <div class="steps mt24">
        <div class="step" style="justify-content:space-between"><span style="font-weight:600">Ratings</span><span style="display:flex;gap:6px;align-items:center;color:var(--accent);font-weight:600;font-size:14px">${I.check('currentColor', 16)} Saved</span></div>
        <div class="step" style="justify-content:space-between"><span style="font-weight:600">Examples</span><span style="display:flex;gap:6px;align-items:center;color:var(--accent);font-weight:600;font-size:14px">${storyLine === 'Skipped' ? 'Skipped' : I.check('currentColor', 16) + ' ' + storyLine}</span></div>
      </div>
      <div class="note mt20">Thought of something else? You can come back to this same link and add more examples.</div>
      <button class="btn secondary mt20" id="more">Add more examples</button>
    </div>
  `);
  on('#more', 'click', () => go('stories'));
}
</script>
</body>
</html>
